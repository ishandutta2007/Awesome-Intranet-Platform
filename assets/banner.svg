<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }

    /* Dynamic CSS Animations */
    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
      50% { transform: translateY(-18px) rotate(180deg); opacity: 0.8; }
      100% { transform: translateY(0px) rotate(360deg); opacity: 0.3; }
    }

    @keyframes pulseCard {
      0% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.03); opacity: 0.95; }
      100% { transform: scale(1); opacity: 0.7; }
    }

    @keyframes lineFlow {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }

    .p1 { animation: floatParticle 8s ease-in-out infinite; }
    .p2 { animation: floatParticle 10s ease-in-out infinite 2s; }
    .p3 { animation: floatParticle 7s ease-in-out infinite 1s; }
    
    .card-anim { animation: pulseCard 6s ease-in-out infinite; transform-origin: center; }

    .animated-line {
      stroke-dasharray: 10 15;
      animation: lineFlow 20s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay for Tech Feel -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" />
    <path d="M150 0 V360 M300 0 V360 M450 0 V360 M600 0 V360 M750 0 V360 M900 0 V360 M1050 0 V360" />
  </g>

  <!-- Dynamic / Background Decorative Elements (Kept behind foreground text) -->
  <!-- Animated Flow Lines in Background -->
  <path d="M -50 280 Q 300 120 600 290 T 1250 180" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.3" class="animated-line" />
  <path d="M -50 100 Q 400 320 800 100 T 1250 240" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25" class="animated-line" />

  <!-- Floating Ambient Particles -->
  <circle cx="150" cy="80" r="6" fill="#a855f7" class="p1" filter="url(#glow)" />
  <circle cx="1050" cy="90" r="8" fill="#38bdf8" class="p2" filter="url(#glow)" />
  <circle cx="920" cy="290" r="5" fill="#ec4899" class="p3" filter="url(#glow)" />
  <rect x="180" y="270" width="12" height="12" rx="3" fill="#6366f1" class="p2" transform="rotate(45 186 276)" opacity="0.5" />

  <!-- Foreground Title Block -->
  <!-- Top Accent Bar -->
  <rect x="80" y="70" width="160" height="6" rx="3" fill="url(#accentGrad)" />

  <!-- Main Title -->
  <text x="80" y="135" class="title">Awesome Intranet Platform</text>
  
  <!-- Subtitle -->
  <text x="80" y="175" class="subtitle">Curated Ecosystem of Modern Digital Workplaces &amp; Enterprise Social Hubs</text>

  <!-- Dynamic Pill Badges / Feature Tags -->
  <g transform="translate(80, 215)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="36" rx="18" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1" />
    <circle cx="20" cy="18" r="6" fill="#6366f1" />
    <text x="36" y="23" class="badge-text">SaaS Platforms</text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="180" height="36" rx="18" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1" />
    <circle cx="195" cy="18" r="6" fill="#a855f7" />
    <text x="211" y="23" class="badge-text">Open-Source Hubs</text>

    <!-- Pill 3 -->
    <rect x="370" y="0" width="190" height="36" rx="18" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1" />
    <circle cx="390" cy="18" r="6" fill="#ec4899" />
    <text x="406" y="23" class="badge-text">Employee Experience</text>
  </g>

  <!-- Right Side Decorative Graphic (Constellation / Network Nodes) -->
  <g transform="translate(880, 80)" class="card-anim">
    <!-- Semi-transparent Glass Card -->
    <rect x="0" y="0" width="240" height="190" rx="16" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    
    <!-- Mini Graphic Connections inside card -->
    <line x1="50" y1="50" x2="120" y2="95" stroke="#94a3b8" stroke-width="2" opacity="0.6" />
    <line x1="120" y1="95" x2="190" y2="45" stroke="#94a3b8" stroke-width="2" opacity="0.6" />
    <line x1="120" y1="95" x2="80" y2="145" stroke="#94a3b8" stroke-width="2" opacity="0.6" />
    <line x1="120" y1="95" x2="170" y2="140" stroke="#94a3b8" stroke-width="2" opacity="0.6" />

    <!-- Network Nodes -->
    <circle cx="50" cy="50" r="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="3" />
    <circle cx="190" cy="45" r="10" fill="#1e1b4b" stroke="#38bdf8" stroke-width="3" />
    <circle cx="120" cy="95" r="18" fill="#6366f1" filter="url(#glow)" />
    <circle cx="80" cy="145" r="12" fill="#1e1b4b" stroke="#a855f7" stroke-width="3" />
    <circle cx="170" cy="140" r="15" fill="#1e1b4b" stroke="#ec4899" stroke-width="3" />

    <!-- Node Icons (Simplified shapes) -->
    <circle cx="120" cy="95" r="6" fill="#ffffff" />
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="354" width="1200" height="6" fill="url(#accentGrad)" />
</svg>
